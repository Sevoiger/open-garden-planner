# Small opt-in workflow set. Plain pytest tests/ still runs the inherited suite.
[pytest]
testpaths =
    tests/integration/test_perennial_garden.py
    tests/integration/test_catalog_palette.py
    tests/integration/test_personal_plant_visual.py
    tests/integration/test_macos_popups.py
    tests/integration/test_garden_memory_mcp.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
qt_api = pyqt6
timeout = 180
markers =
    perf: performance benchmarks and NFR budget tests
    real_weather_worker: tests exercising the real _WeatherFetchWorker lifecycle
