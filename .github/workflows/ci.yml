name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  agent-context:
    name: Agent context parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - name: Check Claude/Codex context parity
        run: python scripts/check_agent_context.py

      - name: Check external action pins
        run: python scripts/check_action_pins.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - uses: ./.github/actions/setup-locked-env

      - name: Run ruff
        run: ruff check src/ tests/ scripts/

      - name: Validate repository wiki sources (offline)
        run: python scripts/sync_wiki.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - uses: ./.github/actions/setup-locked-env

      - name: Check all translation catalogs against current source
        run: python scripts/check_translations.py

      # `--durations=0` records the per-test cost (#509). Nothing in the repo
      # captured where the wall clock went, so every speed-up was a guess; this
      # makes the measurement a byproduct of a run that has to happen anyway.
      # `tee` keeps the live progress and failures in the log while also writing
      # the report for the artifact below. The `pipefail` that keeps a failing suite
      # from reporting green comes from the `shell: bash` line further down, which
      # runs `bash --noprofile --norc -eo pipefail {0}`; the explicit `set -o pipefail`
      # in the script body is therefore a no-op. It is kept because removing it would
      # make the guarantee depend on a reader remembering that `shell:` line, but the
      # guarantee itself does not live here — an earlier version of this comment credited
      # this line and so would have kept the script safe even if `shell:` changed.
      #
      # Parallelism is NOT spelled out here. `addopts` carries `-n auto --dist
      # worksteal`, which resolves to 4 workers on ubuntu-latest's 4 vCPUs. On this
      # 20-core box the same flag gave 4.31x over serial at `-n 8` (673.6s ->
      # 156.2s); at 4 workers the measured figure is 2.7x (245.2s), so 4.31x must not
      # be quoted as this job's speed-up.
      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          pytest tests/ -v --durations=0 2>&1 | tee test-durations.txt

      # The wall-clock-sensitive tests, deselected from the default run by
      # `addopts` (-m 'not perf') so they never share a runner with the parallel
      # workers. They still run on every push, here, alone and serial.
      #
      # `tests/ -m perf`, NOT `tests/perf -m perf`: the marker means "wall-clock
      # sensitive", so it is applied by measurement rather than by directory. Three
      # such tests live outside tests/perf/ and were found by auditing for
      # wall-clock assertions rather than by listing the perf directory — a
      # map-picker close bound (0.5 s), the point-snapper mean (16 ms) and the
      # spatial-index medians (200 ms / 1 ms). Senior review caught that the ADR
      # justified the split with one of them while the split did not cover it (#509).
      - name: Run performance budgets on a quiet runner
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -m perf -v -n 0

      - name: Upload the per-test duration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-durations-linux
          path: test-durations.txt

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - uses: ./.github/actions/setup-locked-env

      - name: Run Bandit (fail on HIGH severity)
        run: bandit -r src/ --severity-level high

      # Credential scan over EVERY tracked file, not just src/.
      #
      # Added after a live Agent API write token was committed to the repo root
      # in a throwaway verification script and pushed (PR #369, 2026-09-29).
      # Bandit never saw it: it runs `-r src/`, and the file was at the repo
      # root — outside that scope — and Bandit has no rule for a credential in
      # a URL query string, which is exactly how OGP's token travels.
      #
      # gitleaks was tried first and rejected on measurement, not taste: its
      # `generic-api-key` rule matches identifier NAMES, and this repo's
      # vocabulary is full of them (`species_key`, `exclude_antagonists_of`, a
      # "Shift+Arrow Keys" row in the translation table) — 29 findings, zero
      # real secrets. Suppressing that rule is not viable either, because it is
      # the rule that catches an OGP token. An `[[allowlists]]` scoped by rule
      # + path was silently ignored under `[extend] useDefault`: identical
      # finding count with and without it. A gate nobody can keep green is a
      # gate that ends up catching nothing, so this targets the specific
      # credential formats instead — see scripts/check_no_secrets.py for the
      # rejected alternatives and the reasoning.
      - name: Check for committed secrets
        run: python scripts/check_no_secrets.py

  dependencies:
    name: Dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-locked-env
      - name: Verify lock and export
        run: python scripts/check_dependency_lock.py

      # Lock-based dependency vulnerability scan (AUD-054). Audits the same
      # locked closure the environment installs (all extras, the dev group and
      # the build group), so a finding here is a finding in a shipped or build
      # artifact — or in a development tool that would run in CI.
      #
      # Runs on BOTH matrix OSes on purpose: the export is universal and
      # pip-audit evaluates markers against the running interpreter, so a
      # Windows-only runtime dependency (mcp requires pywin32 on win32) is
      # invisible to a Linux-only scan — measured, senior review round 3.
      # `shell: bash` keeps the redirection UTF-8 on the Windows runner.
      #
      # The single recorded exception is the setuptools advisory
      # PYSEC-2026-3447 / GHSA-h35f-9h28-mq5c: it only affects publishing macOS
      # source distributions, which this project never does. Setuptools code is
      # bundled; the waiver concerns that unused operation — justified in
      # docs/11-risks-and-technical-debt/README.md §11.2, and its fix (83.0.0)
      # is tracked for a separately reviewed dependency PR.
      - name: Audit locked dependencies
        shell: bash
        run: |
          uv export --locked --all-extras --group build --no-emit-project --no-hashes > locked-requirements.txt
          pip-audit -r locked-requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-3447

  types:
    name: Types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-locked-env
      - name: Enforce per-file type allowances
        run: python scripts/check_mypy_baseline.py --report type-report.json
      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: types-${{ matrix.os }}
          path: type-report.json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - uses: ./.github/actions/setup-locked-env

      # NO `-m` filter here, deliberately, and the reason is the opposite of what an
      # earlier draft of this comment claimed.
      #
      # That draft added `-m 'not perf'` to match `addopts`, justified by the claim
      # that the floors in quality/coverage-floors.json are unchanged by excluding the
      # perf tests. Measured on this branch, that claim is false, and the measurement is
      # the whole content of this comment:
      #
      #   full suite, perf INCLUDED  -> "regressions": [], exit 0
      #   full suite, `-m 'not perf'`-> "regressions": [{"package": "agent_api", "floor":
      #                                    92, "covered_statements": 2012}], exit 1
      #
      # agent_api drops from 92.30% to 91.71%. Fourteen statements is the entire margin,
      # and they come from the two `perf`-marked tests in
      # tests/integration/test_agent_api_shutdown.py — the only coverage in the suite of
      # server.py's start()/_check_port_free()/_start_locked()/_run() block. So the
      # marker, which exists to keep wall-clock assertions off a loaded runner, was
      # silently removing a product lifecycle from the only job that measures it.
      #
      # The two costs of leaving the perf tests in are both pre-existing and both
      # stated rather than hidden:
      #   * The NFR repaint budget fails under tracing (20.29 ms vs a 16.70 ms budget) —
      #     the tracer inflates the repaints it measures. Reproduces at `-n 0`. This job
      #     has been red for that reason since before #509; measured on `master` at
      #     412f01bd it is already 2 failed with `regressions: []`.
      #   * ADR-058 predicted this shape of failure — a gate that is not in branch
      #     protection going red while looking authoritative — eleven lines before
      #     creating it. It did not help that the wrong fix seemed to remove the
      #     failure; it moved it to the floor gate and made the comment assert the
      #     opposite of what the gate reported.
      #
      # So this job keeps master's behaviour and its master's redness. Deciding whether
      # `Coverage` should be a required check — and whether the baseline SHOULD include
      # the NFR tests at all — is a policy question for the owner, deliberately not
      # answered here.
      - name: Measure full-suite line and branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest tests/ -v -o addopts="-v --tb=short -n auto --dist worksteal"
          --cov=open_garden_planner --cov-branch --cov-report=xml --cov-report=term
      - name: Enforce package line floors
        if: always()
        run: python scripts/check_coverage_floors.py --xml coverage.xml --report coverage-summary.json
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-linux
          path: |
            coverage.xml
            coverage-summary.json
