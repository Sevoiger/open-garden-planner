name: Frozen self-test

# The frozen exe's gate, BEFORE a merge.
#
# release.yml runs `--selftest` in the frozen exe -- but only on a push to
# master, so a change that breaks the bundle (a module PyInstaller no longer
# finds, a QML or shader file the spec does not ship, a Qt wheel mismatch) was
# first seen by CI after the merge that caused it. Until now the only run before
# a merge was the one on the author's machine (`ogp-change-control` 2.8).
#
# This workflow builds the bundle with the SAME recipe release.yml uses
# (installer/build_installer.py -- only the NSIS installer step is skipped) and
# runs both checks of 2.8 on it: the 8-second smoke, and `--selftest`.
#
# It runs on a pull request only when a path below changes, and on demand
# (workflow_dispatch). It is NOT a required check
# (quality/master-protection.json): a required check that a path filter skips
# never reports, and would block every pull request it does not run on. The
# local gate of 2.8 stays mandatory.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "installer/**"
      - "src/open_garden_planner/main.py"
      - "src/open_garden_planner/__main__.py"
      - "src/open_garden_planner/ui/view3d/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pylock.toml"
      - ".github/workflows/frozen-selftest.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-locked-env/**"

permissions:
  contents: read

jobs:
  frozen-selftest:
    name: Frozen self-test (windows-latest)
    runs-on: windows-latest
    # The build takes most of it (a release run, which also builds the installer,
    # takes 9-13 minutes).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-locked-env

      # The release recipe, not a copy of it: the same script, the same spec, the
      # same `PyInstaller --noconfirm --clean`. Without --version no _version.py is
      # written; without NSIS no installer is built -- neither is under test here.
      - name: Build the bundle (the release recipe, without the installer)
        run: python installer/build_installer.py --skip-nsis

      # Check 1 of 2.8: the process is still running after 8 seconds. `timeout`
      # kills it then and reports 124 -- which is the pass. It proves the exe
      # starts; it cannot see a subsystem that is dead inside a running process
      # (#291 hid from it for six releases). That is what the next step is for.
      - name: Smoke test (the process stays up for 8 seconds)
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          timeout 8 dist/OpenGardenPlanner/OpenGardenPlanner.exe
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::The frozen exe did not stay up for 8 seconds (exit $code; 124 = still running when the timeout killed it = pass)."
            exit 1
          fi
          echo "Smoke test passed: the process was still running after 8 seconds (exit 124)."

      # Check 2 of 2.8. See release.yml for why it is started with Start-Process
      # -Wait -PassThru, why the verdict comes first and why the log cannot fail
      # the step: this script is the SAME text as release.yml's (pinned by
      # tests/unit/test_quick3d_packaging.py).
      - name: Verify frozen subsystems (Qt3D #277, Agent API #291, Qt Quick 3D render)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = "dist/OpenGardenPlanner/OpenGardenPlanner.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::Frozen exe not found: $exe"; exit 1 }
          $env:OGP_SELFTEST_LOG = Join-Path $env:RUNNER_TEMP "ogp-selftest-3d.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $failed = $p.ExitCode -ne 0
          if ($failed) {
            Write-Host "::error::Frozen self-test failed (exit $($p.ExitCode)). It covers the Qt3D bindings + Qt version match (#277), the embedded Agent API server binding (#291) AND the Qt Quick 3D engine (Garden.qml and its shaders loaded from the bundle and rendered into one frame on this GPU-less runner, Direct3D 11 on WARP) - one of those is dead in this build. The self-test log below names the failed 3D check, or shows the watchdog's reason and stack dump if any part hung."
          } else {
            Write-Host "Frozen self-test passed (exit 0): Qt3D bindings, Agent API and the Qt Quick 3D render are all alive."
          }
          try {
            if (Test-Path -LiteralPath $env:OGP_SELFTEST_LOG) {
              Write-Host "--- self-test log ($env:OGP_SELFTEST_LOG) ---"
              Get-Content -LiteralPath $env:OGP_SELFTEST_LOG -ErrorAction Stop | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "No self-test log was written: the exe did not get as far as opening it."
            }
          } catch {
            Write-Host "The self-test log could not be printed ($($_.Exception.Message)). The verdict above stands."
          }
          if ($failed) { exit 1 }
