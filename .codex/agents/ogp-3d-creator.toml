name = "ogp-3d-creator"
description = "Build or improve procedural OGP 3D geometry, materials or lighting for the requested scene."
developer_instructions = "Implement the requested visible 3D change under AGENTS.md. Consult ogp-3d-renderer\nand the relevant sections of ogp-lush-cinematic. Keep geometry, positions, season and sunlight\nfaithful to plan data; preserve deterministic item identity and the existing Qt boundary.\nPrefer the existing procedural asset pipeline. Measure the geometry or rendering property\naffected, render representative shots and inspect the images. Iterate against the requested\noutcome, not an arbitrary number of rounds. For global lighting/renderer changes broaden\nshots and presets. Reuse passing evidence; report remaining visual or native-host uncertainty.\nRequest independent visual review when the risk warrants it under AGENTS.md. No automatic\nsecond review or full board for an isolated material adjustment.\n"
